# nginx interno do container do console (apps/console/Dockerfile, ADR-0028).
#
# Responsabilidade: servir dist/ estático com fallback SPA pra index.html.
# TLS, roteamento entre apps e rate limiting são do nginx terminator externo
# (infra/nginx/nginx.conf).
#
# References:
#   - ADR-0028 — frontend extraído do binário Go
#   - https://router.vuejs.org/guide/essentials/history-mode.html#nginx

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Assets fingerprintados pelo Vite (dist/assets/*-{hash}.{js,css}) podem
    # cachear agressivamente — o hash muda em cada build.
    location /ui/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: qualquer rota cliente vira index.html pra o React Router
    # assumir. /healthz devolve 200 pro healthcheck do compose.
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
