# Compose multi-app do API Gateway (ADR-0030).
#
# Servicos:
#   - nginx     : TLS terminator + routing 3-vias (infra/nginx/nginx.conf)
#   - gateway   : Go data plane + admin Go (transicao; ADR-0027 Fase 5 desliga depois)
#   - console   : React+Vite SPA estatica via nginx interno (apps/console/Dockerfile)
#   - admin-api : .NET 10 admin plane (27/27 endpoints; nginx rola Auth desde Fase 4d)
#
# SQL Server eh externo (BRSPVPDEV003.tpb.corp) — nao roda em container
# conforme ADR-0022. Containers gateway/admin-api assumem conectividade VPN.
#
# Subir:
#   cd infra/docker
#   cp .env.example .env
#   nano .env                # preencher segredos (KEYVAULT_URI, SQL_CONNECTION_STRING,
#                            #                    DATABASE_ENCRYPTION_KEY_HEX, SP creds)
#   docker compose up -d --build
#
# Logs:
#   docker compose logs -f gateway     # Go data plane + admin Go (transicao)
#   docker compose logs -f admin-api   # Serilog JSON do admin .NET
#   docker compose logs -f nginx       # access_log JSON estruturado
#
# Status:
#   docker compose ps                  # todos os 4 servicos -> "(healthy)"
#   docker compose exec nginx nginx -t # validar config sintaxe
#
# Migrations:
#   - Gateway Go aplica via golang-migrate no boot quando MIGRATIONS_AUTO_APPLY=true.
#     NAO ha subcomando CLI no binario gateway.exe — toggle off requer rodar
#     o cliente `migrate` (golang-migrate/migrate) externamente no DB.
#   - admin-api .NET roda DbUp por CLI separado (preserva ADR-0025):
#       docker compose run --rm admin-api migrate up
#       docker compose run --rm admin-api migrate status
#     Bookkeeping separado: schema_migrations (Go) vs gogateway.SchemaVersions (.NET).
#     Scripts .up.sql sao idempotentes — rodar ambos contra o mesmo schema eh seguro.
#
# References:
#   - ADR-0022 — SQL Server corporativo
#   - ADR-0025 — MIGRATIONS_AUTO_APPLY toggle
#   - ADR-0027 — admin .NET (rolagem futura)
#   - ADR-0030 — monorepo apps/
#   - infra/nginx/nginx.conf
#   - docs/deploy/oracle-linux.md

name: api-gateway

services:

  # ─────────────────────────────────────────────────────────────────────────
  # nginx — TLS terminator + routing
  # ─────────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Config + includes
      - ../../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../infra/nginx/conf.d:/etc/nginx/conf.d:ro
      # Certs vem do host (CA corp). Em prod, /etc/api-gateway/certs.
      - ${CERTS_DIR:-../../infra/nginx/certs}:/etc/nginx/certs:ro
      # Logs estruturados — bind no host pra agregacao via filebeat/fluent-bit.
      - ${LOG_DIR:-./logs/nginx}:/var/log/nginx
    depends_on:
      gateway:
        condition: service_healthy
      console:
        condition: service_healthy
      admin-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/__nginx_healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────────────
  # gateway — Go data plane (admin ainda incluido nesta versao de transicao)
  # ─────────────────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ../../apps/gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      CONFIG_PATH:                ${CONFIG_PATH:-/app/configs/gateway.yaml}
      KEYVAULT_URI:               ${KEYVAULT_URI}
      AZURE_OPENAI_ENDPOINT:      ${AZURE_OPENAI_ENDPOINT}
      AZURE_LANGUAGE_ENDPOINT:    ${AZURE_LANGUAGE_ENDPOINT:-}
      PROVIDER:                   ${PROVIDER:-azure}
      LOG_LEVEL:                  ${LOG_LEVEL:-info}
      MIGRATIONS_AUTO_APPLY:      ${MIGRATIONS_AUTO_APPLY:-true}
      # Azure auth via Managed Identity (recommended) — se rodar em VM Azure.
      # Em host nao-Azure usar AZURE_CLIENT_ID + AZURE_TENANT_ID + AZURE_CLIENT_SECRET
      # via service principal (NUNCA commitar; vem do .env do host).
      AZURE_CLIENT_ID:            ${AZURE_CLIENT_ID:-}
      AZURE_TENANT_ID:            ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_SECRET:        ${AZURE_CLIENT_SECRET:-}
    volumes:
      # Override do gateway.yaml local pra customizacao por ambiente.
      # Default monta o que ja esta na imagem; mounting host file faz override.
      - ${GATEWAY_CONFIG_PATH:-../../apps/gateway/configs/gateway.yaml}:/app/configs/gateway.yaml:ro
      # Logs estruturados slog JSON.
      - ${LOG_DIR:-./logs/gateway}:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────────
  # console — React+Vite SPA standalone (ADR-0028)
  # ─────────────────────────────────────────────────────────────────────────
  console:
    build:
      context: ../../apps/console
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────────────
  # admin-api — .NET 10 admin plane (ADR-0027)
  #
  # Os 27 endpoints estao implementados. Migration ownership ainda eh
  # compartilhado: gateway Go aplica via golang-migrate; admin-api .NET nao
  # roda DbUp no boot (preserva ADR-0025), mas o CLI esta disponivel:
  #   docker compose run --rm admin-api migrate up
  #
  # Rolagem nginx: hoje so /admin/v1/auth/{login,logout} aponta pra ca.
  # Resto continua no gateway Go ate Fase 5 desligar o admin Go.
  # ─────────────────────────────────────────────────────────────────────────
  admin-api:
    build:
      context: ../../apps/admin-api
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT:        ${DOTNET_ENVIRONMENT:-Production}
      ConnectionStrings__Gateway:    ${SQL_CONNECTION_STRING}
      Database__EncryptionKeyHex:    ${DATABASE_ENCRYPTION_KEY_HEX}
      KeyVault__Uri:                 ${KEYVAULT_URI}
      Audit__ApplicationName:        admin-api
      # Azure auth: Managed Identity (VM Azure) ou Service Principal (host
      # on-prem). Vars vazias = DefaultAzureCredential tenta a cadeia padrao.
      AZURE_CLIENT_ID:               ${AZURE_CLIENT_ID:-}
      AZURE_TENANT_ID:               ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_SECRET:           ${AZURE_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
