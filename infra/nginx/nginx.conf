# nginx terminator do API Gateway (ADR-0030).
#
# Responsabilidades:
#   - TLS termination (cert corp em /etc/nginx/certs/)
#   - Roteamento 3-vias por path:
#       /                → console (SPA, container apps/console)
#       /admin/v1/*      → gateway Go (durante transicao; vai rolar pra .NET slice a slice)
#       /v1/*            → gateway Go (data plane — SSE friendly)
#       /healthz, /readyz → gateway Go
#   - Rate limit por IP em /admin/v1/auth/login (anti brute-force)
#   - Gzip pra assets do console
#   - Logs estruturados JSON (compativel com agregadores)
#
# References:
#   - ADR-0027 — admin .NET (rolagem slice a slice)
#   - ADR-0028 — frontend extraido (console em container proprio)
#   - ADR-0030 — monorepo apps/ + infra/

# ── Eventos + globals ─────────────────────────────────────────────────────────
user                  nginx;
worker_processes      auto;
worker_rlimit_nofile  16384;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    # ── MIME + body limits ────────────────────────────────────────────────────
    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;
    client_max_body_size 1m;

    # ── Logs estruturados JSON ────────────────────────────────────────────────
    # Formato compativel com agregadores (sumo, splunk, elastic). Cuidado:
    # nao loggar Authorization nem body — apenas metadados.
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"method":"$request_method",'
        '"path":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_status":"$upstream_status",'
        '"user_agent":"$http_user_agent",'
        '"referer":"$http_referer",'
        '"request_id":"$http_x_request_id"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile         on;
    tcp_nopush       on;
    tcp_nodelay      on;
    keepalive_timeout  65s;
    types_hash_max_size 2048;
    server_tokens    off;

    # ── Gzip pros assets do console ───────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Rate limit zones ──────────────────────────────────────────────────────
    # Burst-friendly defaults; auth login mais apertado pra anti brute-force.
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=admin_zone:10m rate=120r/m;
    limit_req_status 429;

    # ── Upstreams ─────────────────────────────────────────────────────────────
    # nginx em container junto com gateway/admin-api/console via service names
    # do docker-compose. Em Swarm/k8s, eh DNS-driven; aqui ja roda load balance
    # interno se replicas > 1.
    upstream gateway_upstream {
        server gateway:8080;
        keepalive 32;
    }

    upstream console_upstream {
        server console:80;
        keepalive 16;
    }

    # admin-api .NET ainda nao consumido em transicao Go-only. Quando rolar
    # slices, eh so trocar o upstream em location /admin/v1/auth/ etc.
    upstream admin_api_upstream {
        server admin-api:8080;
        keepalive 32;
    }

    # ── Server: HTTP → HTTPS redirect ─────────────────────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # ACME challenge passthrough opcional pra Let's Encrypt; em rede corp
        # o cert vem da CA interna entao essa location costuma ficar inutil.
        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Server: HTTPS principal ───────────────────────────────────────────────
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name _;

        # Cert vem da CA corp; ver infra/nginx/certs/README.md.
        ssl_certificate           /etc/nginx/certs/tls.crt;
        ssl_certificate_key       /etc/nginx/certs/tls.key;
        ssl_trusted_certificate   /etc/nginx/certs/ca.crt;

        # Protocols + ciphers conservadores (TLS 1.2/1.3 only).
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1h;
        ssl_session_tickets off;
        ssl_stapling off;  # CA interna geralmente nao tem OCSP responder

        # ── Headers de hardening ──────────────────────────────────────────────
        # HSTS — sub-domains opcional dependendo da topologia DNS corp.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-XSS-Protection "0" always;

        # ── Healthz pro Compose/k8s probe externo (nao bate no gateway) ───────
        location = /__nginx_healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ── /healthz e /readyz vao pro gateway Go (paridade com compose) ──────
        location ~ ^/(healthz|readyz)$ {
            access_log off;
            proxy_pass http://gateway_upstream;
            include /etc/nginx/conf.d/proxy_common.conf;
        }

        # ── Admin auth (rate-limited) ─────────────────────────────────────────
        # Anti brute-force: 10 req/min por IP. Burst 5 pra retry/typo razoavel.
        # Slice rolada pra admin-api .NET em 2026-06-02 (ADR-0027 Fase 4d).
        # Demais paths /admin/v1/* continuam no gateway Go ate Fase 5.
        location = /admin/v1/auth/login {
            limit_req zone=login_zone burst=5 nodelay;
            proxy_pass http://admin_api_upstream;
            include /etc/nginx/conf.d/proxy_common.conf;
        }

        location = /admin/v1/auth/logout {
            proxy_pass http://admin_api_upstream;
            include /etc/nginx/conf.d/proxy_common.conf;
        }

        # ── Admin plane geral ─────────────────────────────────────────────────
        location /admin/v1/ {
            limit_req zone=admin_zone burst=30 nodelay;
            proxy_pass http://gateway_upstream;
            include /etc/nginx/conf.d/proxy_common.conf;
        }

        # ── Data plane /v1/* (chat + proxy generico) ──────────────────────────
        # SSE: proxy_buffering off + read_timeout grande pra streaming longo.
        location /v1/ {
            proxy_pass http://gateway_upstream;
            include /etc/nginx/conf.d/proxy_common.conf;

            # SSE friendly (ADR-0008 WriteTimeout=0 no Go)
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Console SPA na raiz ───────────────────────────────────────────────
        # Tudo nao prefixado por /admin/v1/, /v1/, /healthz, /readyz, /__nginx_*
        # cai pra ca. Console serve /ui/* internamente + fallback pra index.html.
        location / {
            proxy_pass http://console_upstream;
            include /etc/nginx/conf.d/proxy_common.conf;
        }
    }
}
