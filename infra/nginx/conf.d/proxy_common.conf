# Headers + timeouts compartilhados por todas as `location proxy_pass`.
# Vem em include separado pra evitar duplicacao em cada location block.

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Request-Id      $http_x_request_id;

# Propaga Authorization sem replicar em cada location.
proxy_pass_request_headers on;

# Timeouts default (SSE override em /v1/ no nginx.conf principal).
proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# Retry quando upstream caiu (timeout / refused), nao em 5xx (gateway pode ja
# ter executado mutacao parcial — evitar idempotencia falsa).
proxy_next_upstream error timeout invalid_header;
proxy_next_upstream_tries 2;
